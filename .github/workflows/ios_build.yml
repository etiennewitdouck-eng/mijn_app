name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App without Xcode Archive restrictions
        run: |
          # Compileert de app voor iOS-device zonder codesign en dwingt xcodebuild in te binden als losse app
          flutter build ios --release --no-codesign --no-pub

      - name: Package IPA correctly
        run: |
          mkdir -p Payload
          # Zoek de gebouwde app en kopieer deze naar de Payload map
          find build/ios/iphoneos -name "*.app" -maxdepth 2 -exec cp -R {} Payload/ \;
          zip -r Payload.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-app-build
          path: Payload.ipa
          