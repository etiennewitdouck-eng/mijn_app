name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Xcode project to bypass signing
        run: |
          cd ios
          # Verwijder de eis voor een Development Team uit het Xcode projectbestand
          find . -name "project.pbxproj" -exec sed -i '' '/DEVELOPMENT_TEAM/d' {} +
          cd ..

      - name: Build iOS Release App (No codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Payload.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-app-build
          path: Payload.ipa

          