name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install --repo-update

      - name: Build Dart bundle for iOS
        run: flutter build ios --release --no-pub --no-codesign --config-only

      - name: Compile with xcodebuild (Bypass Provisioning Profile)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_STYLE=Manual \
                     DSTROOT="$PWD/build/dst" \
                     OBJROOT="$PWD/build/obj" \
                     SYMROOT="$PWD/build/sym" \
                     BUILD_DIR="$PWD/build"

      - name: Package IPA correctly
        run: |
          mkdir -p Payload
          # Zoek de gebouwde app in de xcodebuild output en kopieer deze
          cp -R ios/build/Release-iphoneos/Runner.app Payload/
          zip -r Payload.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-app-build
          path: Payload.ipa
          